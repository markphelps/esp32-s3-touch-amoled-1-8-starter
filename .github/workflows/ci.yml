# These five jobs are the required pull-request checks: firmware, host-tools,
# python-style, secrets, and licenses.
#
# The host jobs run the same mise tasks that contributors run locally. The
# firmware job runs in the official ESP-IDF container and calls `idf.py`.
#
# Each action uses a commit SHA. The container uses an image digest.
#
# No job uploads a firmware binary, build directory, or release artifact.

name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The firmware job uses the ESP-IDF container. This value prevents each host
  # job from installing a second ESP-IDF checkout through the mise hook.
  APP_SKIP_IDF: "1"

jobs:
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    # Keep this release equal to IDF_TAG in tools/setup_idf.py.
    # v5.5.5
    container:
      image: >-
        espressif/idf@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -C firmware build

      - name: Make sure that the build used the committed dependency lock
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- firmware/dependencies.lock

  host-tools:
    name: host-tools (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.5
          install_args: python
      - run: mise run test-host

  python-style:
    name: python-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.5
          install_args: ruff
      - run: mise run format-check
      - run: mise run lint

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      # The history scan needs every branch and tag. A shallow checkout hides
      # most of the repository history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.5
          install_args: python gitleaks
      - run: mise run secrets

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.5
          install_args: pipx
      - run: mise run licenses
